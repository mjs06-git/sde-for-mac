<?xml version="1.0" encoding="UTF-8"?>
<!-- The app icon (v3.0, concept A from the mock-ups): rendered to src/Sde.App/Assets/icon-1024.png by tools/icon/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>SDE for Mac: a house cut away to show floodwater measured on a staff gauge</title>
  <defs>
    <clipPath id="a-sq"><rect x="100" y="100" width="824" height="824" rx="186" /></clipPath>
    <filter id="a-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14" /></filter>
    <filter id="a-blur-sm" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7" /></filter>
    <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9DDBC" /><stop offset=".55" stop-color="#EBD9CB" /><stop offset="1" stop-color="#C9DCE8" /></linearGradient>
    <radialGradient id="a-sun" cx="0.26" cy="0.24" r="0.5"><stop offset="0" stop-color="#FFF4DE" stop-opacity=".95" /><stop offset="1" stop-color="#FFF4DE" stop-opacity="0" /></radialGradient>
    <linearGradient id="a-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55627A" /><stop offset="1" stop-color="#36404F" /></linearGradient>
    <linearGradient id="a-cut" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" /><stop offset="1" stop-color="#E9E3D8" /></linearGradient>
    <linearGradient id="a-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8D3B2" /><stop offset="1" stop-color="#D9BF98" /></linearGradient>
    <linearGradient id="a-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8EEF8" /><stop offset="1" stop-color="#9CC6DE" /></linearGradient>
    <linearGradient id="a-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07E52" /><stop offset="1" stop-color="#8A5D38" /></linearGradient>
    <linearGradient id="a-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F86C6" stop-opacity=".78" /><stop offset=".45" stop-color="#1E62A0" stop-opacity=".88" /><stop offset="1" stop-color="#0F3864" stop-opacity=".97" /></linearGradient>
    <linearGradient id="a-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".38" /><stop offset=".35" stop-color="#FFFFFF" stop-opacity="0" /></linearGradient>
    <pattern id="a-paper" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="none" /><path d="M0 9h18" stroke="#CDB28A" stroke-width="1.5" opacity=".45" /></pattern>
    <pattern id="a-insul" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16 16 0" stroke="#D9CFC0" stroke-width="2" /></pattern>
  </defs>

