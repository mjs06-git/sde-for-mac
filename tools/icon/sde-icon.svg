      <rect x="770" y="440" width="30" height="8" /><rect x="770" y="460" width="30" height="8" /><rect x="770" y="480" width="30" height="8" /><rect x="770" y="440" width="10" height="48" />
    </g>
    <g fill="#C8102E">
