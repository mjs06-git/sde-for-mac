      <rect x="798" y="488" width="30" height="8" /><rect x="798" y="508" width="30" height="8" /><rect x="798" y="528" width="30" height="8" /><rect x="818" y="488" width="10" height="48" />
    </g>
    <g fill="#1F2329">
      <rect x="770" y="536" width="30" height="8" /><rect x="770" y="556" width="30" height="8" /><rect x="770" y="576" width="30" height="8" /><rect x="770" y="536" width="10" height="48" />
      <rect x="770" y="632" width="30" height="8" /><rect x="770" y="652" width="30" height="8" /><rect x="770" y="672" width="30" height="8" /><rect x="770" y="632" width="10" height="48" />
      <rect x="770" y="728" width="30" height="8" /><rect x="770" y="748" width="30" height="8" /><rect x="770" y="768" width="30" height="8" /><rect x="770" y="728" width="10" height="48" />
    </g>
    <g fill="#C8102E">
      <rect x="798" y="584" width="30" height="8" /><rect x="798" y="604" width="30" height="8" /><rect x="798" y="624" width="30" height="8" /><rect x="818" y="584" width="10" height="48" />
      <rect x="798" y="680" width="30" height="8" /><rect x="798" y="700" width="30" height="8" /><rect x="798" y="720" width="30" height="8" /><rect x="818" y="680" width="10" height="48" />
