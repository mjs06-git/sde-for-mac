<?xml version="1.0" encoding="UTF-8"?>
<!-- The app icon simplified for 16 and 32 px (Finder lists, the menu bar): the same scene with bold shapes only. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>SDE for Mac, small sizes</title>
  <defs>
    <clipPath id="s-sq"><rect x="100" y="100" width="824" height="824" rx="186" /></clipPath>
    <linearGradient id="s-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D9B5" /><stop offset="1" stop-color="#D8DFE6" /></linearGradient>
    <linearGradient id="s-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F86C6" /><stop offset="1" stop-color="#123F70" /></linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#s-sky)" />
  <g clip-path="url(#s-sq)">
    <path d="M190 470 L470 230 L750 470 Z" fill="#3E4A5C" />
    <rect x="250" y="440" width="440" height="230" fill="#E9D4B0" />
    <rect x="320" y="480" width="120" height="100" fill="#FFFFFF" />
    <rect x="335" y="495" width="90" height="70" fill="#9CC6DE" />
    <rect x="545" y="490" width="80" height="180" fill="#8F7353" />
    <rect x="770" y="300" width="100" height="624" fill="#FFFFFF" />
    <rect x="770" y="330" width="60" height="44" fill="#1F2329" />
    <rect x="810" y="410" width="60" height="44" fill="#C8102E" />
    <rect x="770" y="490" width="60" height="44" fill="#1F2329" />
    <rect x="100" y="600" width="824" height="324" fill="url(#s-water)" opacity=".94" />
    <rect x="100" y="586" width="824" height="30" fill="#C8102E" />
  </g>
</svg>
